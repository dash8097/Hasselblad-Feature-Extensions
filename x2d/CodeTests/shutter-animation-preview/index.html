<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X2D · Ciallo 快门动画预览</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#111;color:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:30px 20px}h1{font-size:24px;font-weight:400}.meta,.note,label{font-size:13px;color:#aaa;line-height:1.8}.screen{position:relative;aspect-ratio:4/3;background:#000;overflow:hidden;border:1px solid #333;border-radius:8px}.screen svg{position:absolute;inset:0;width:100%;height:100%}.word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0}.word h2{white-space:pre;font:400 clamp(17px,4.2vw,40px) "Microsoft YaHei","Segoe UI Symbol",sans-serif;margin:0}.leaves{z-index:1}.spark{z-index:2;pointer-events:none}.controls{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:18px}button,select{padding:10px 16px;border-radius:6px;border:1px solid #666;background:#222;color:#fff;cursor:pointer}button{background:#fff;color:#000}label{display:block}.timing{flex:1;min-width:180px}input[type=range]{width:100%;accent-color:#fff}.timeline{margin-top:20px}.labels{display:flex;justify-content:space-between;color:#888;font-size:12px}.status{text-align:right;color:#aaa;font-size:12px;margin-top:8px}output{font-variant-numeric:tabular-nums}.note a{color:#ddd}
</style>
<main>
 <h1>黑屏之间，一次合拢。</h1>
 <p class="meta">X2D · 快门动画视觉候选 · 本地预览</p>
 <div class="screen" aria-label="黑底一行白色颜文字，快门叶片合拢时星星从缝隙跳出">
  <div class="word" id="word"><h2>Ciallo～(∠・ω&lt; )⌒<span id="inlineStar">☆</span></h2></div>
  <svg class="leaves" viewBox="0 0 800 600" aria-hidden="true"><g id="blades" fill="#131313" stroke="#626262" stroke-width="1.2" stroke-linejoin="round"></g></svg>
  <svg class="spark" viewBox="0 0 800 600" aria-hidden="true"><g id="star"><text x="0" y="0" fill="#fff" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Segoe UI Symbol,sans-serif" font-size="100">☆</text></g></svg>
 </div>
 <div class="status" id="status">文字就绪</div>
 <div class="controls">
  <button id="play">播放动画</button>
  <div class="timing"><label for="duration">预览时长 · <output id="durationText">800 ms</output></label><input id="duration" type="range" min="100" max="1000" step="20" value="800"></div>
  <div><label for="speed">播放速度</label><select id="speed"><option value="1">正常速度</option><option value="0.25">¼ 慢动作</option></select></div>
 </div>
 <div class="timeline"><label for="scrub">拖动查看每一帧</label><input id="scrub" type="range" min="0" max="1000" value="0"><div class="labels"><span>一行白字</span><span>叶片遮住文字</span><span>星星穿过缝隙</span><span>展开、淡出</span></div></div>
 <p class="note">颜文字保持原样、单行排版。文字与星星起初在底层，叶片在中间层；仅在快闭合时，星星跃到前景。合拢 200 ms → 闭合停留 200 ms → 展开 200 ms → 叶片保持打开、星星继续飞行 200 ms，共 800 ms，不加额外首尾停顿；用户描述的约半秒黑屏尚未实测，动画时长不决定相机取景恢复。</p>
 <p class="note">动画预览：点击按钮查看曝光反馈。</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const blades=Array.from({length:8},()=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');$('blades').append(p);return p});
const clamp=x=>Math.max(0,Math.min(1,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
let frame=0;
function render(t){
 t=clamp(t);
 const closure=clamp(t/(200/800))*(1-clamp((t-400/800)/(200/800)));
 const radius=t<.25?250*(1-clamp(t/.25)):t<.5?0:(400+300*Math.tan(Math.PI/8))*clamp((t-.5)/.25),twist=.60*closure;
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4+twist,b=a+Math.PI/4;
  const point=(r,angle)=>[400+r*Math.cos(angle),300+r*Math.sin(angle)].join(',');
  blades[i].setAttribute('d','M'+point(radius,a)+'L'+point(radius,b)+'Q'+point(720,b+.25)+' '+point(1500,b+.8)+'L'+point(1500,a+.8)+'Q'+point(720,a+.25)+' '+point(radius,a)+'Z');
 }
 $('word').style.opacity='1';
 $('blades').style.opacity='1';
 const s=clamp((t-170/800)/(630/800)),fade=1-smooth((t-.92)/.08);
 const scale=smooth(s/.25)*(1+.20*Math.sin(s*Math.PI));
 $('inlineStar').style.visibility=t<170/800||t>=1?'visible':'hidden';
 $('star').style.opacity=String(smooth(s/.1)*fade);
 $('star').setAttribute('transform','translate('+(400+300*s)+','+(300-800*s*(1-s)+60*s)+') rotate('+(-20+40*s)+') scale('+scale+')');
 $('status').textContent=t===0?'文字就绪':t<170/800?'叶片合拢':t<200/800?'星星从缝隙跳出':t<400/800?'闭合停留':t<600/800?'叶片展开':t<1?'叶片保持打开，星星继续飞行':'预览结束';
 $('scrub').value=String(Math.round(t*1000));
}
function stop(){cancelAnimationFrame(frame);frame=0;$('play').textContent='重新播放'}
function play(){stop();const start=performance.now(),duration=Number($('duration').value)/Number($('speed').value);function tick(now){const t=Math.min(1,(now-start)/duration);render(t);if(t<1)frame=requestAnimationFrame(tick);else stop()}frame=requestAnimationFrame(tick)}
$('play').addEventListener('click',play);
$('scrub').addEventListener('input',()=>{stop();render(Number($('scrub').value)/1000)});
$('duration').addEventListener('input',()=>{$('durationText').textContent=$('duration').value+' ms'});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
render(0);
</script>
</html>
